allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Fallback for legacy plugins that still declare the package in the manifest
// instead of the `namespace` required by AGP 8+.
subprojects { subproject ->
    if (!subproject.state.executed) {
        subproject.afterEvaluate {
            if (subproject.plugins.hasPlugin("com.android.library")) {
                def androidExt = subproject.extensions.getByName("android")
                if (androidExt.namespace == null) {
                    def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                    def packageName = manifestFile.exists() ?
                            new XmlParser().parse(manifestFile).attribute("package") : null
                    androidExt.namespace = packageName != null ?
                            packageName.toString() : subproject.group.toString()
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
